<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page not found · Siyuan Zheng</title>
<meta name="robots" content="noindex" />

<script>
  // The pCAT portal lives at /PCAT/ (uppercase, because the repository is named
  // PCAT and GitHub Pages paths are case-sensitive). Anyone who types a different
  // casing lands here instead. Send them on, keeping subpath, query and hash.
  (function () {
    var m = location.pathname.match(/^\/pcat(\/.*)?$/i);
    if (m && location.pathname.indexOf('/PCAT') !== 0) {
      location.replace('/PCAT' + (m[1] || '/') + location.search + location.hash);
    }
  })();
</script>
